databases:
  - name: chiane-postgres
    plan: free
    region: singapore
    databaseName: chiane
    user: chiane

services:
  - type: web
    name: chiane-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: chiane-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: OTP_PROVIDER
        value: esms
      - key: OTP_DEV_ECHO
        value: "false"
      - key: OTP_TTL_SECONDS
        value: "300"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "30"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: GEMINI_API_KEY
        sync: false
      - key: ESMS_API_KEY
        sync: false
      - key: ESMS_SECRET_KEY
        sync: false
      - key: ESMS_BRANDNAME
        sync: false
      - key: ZALO_ZNS_ACCESS_TOKEN
        sync: false
      - key: ZALO_ZNS_TEMPLATE_ID
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: REVIEWER_DEMO_PHONE
        sync: false
      - key: REVIEWER_DEMO_OTP
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: ANDROID_APP_SHA256
        sync: false
